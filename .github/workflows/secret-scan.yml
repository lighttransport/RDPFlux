name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-push-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install scanners
        run: |
          GO_TOOLS_BIN="${{ github.workspace }}/go/bin"
          mkdir -p "$GO_TOOLS_BIN"

          GITLEAKS_VERSION=v8.16.0
          TRUFFLEHOG_VERSION=v3.95.6

          go install github.com/zricethezav/gitleaks/v8@"${GITLEAKS_VERSION}"
          go install github.com/trufflesecurity/trufflehog/v3/cmd/trufflehog@"${TRUFFLEHOG_VERSION}"

          echo "${GO_TOOLS_BIN}" >> "${GITHUB_PATH}"
        shell: bash

      - name: Run secret audit
        env:
          TRUFFLEHOG_BIN: "${{ github.workspace }}/go/bin/trufflehog"
        run: |
          git config core.hooksPath .githooks
          ./.githooks/pre-push
        shell: bash
