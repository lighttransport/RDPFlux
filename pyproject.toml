[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdpflux"
version = "0.1.0"
description = "Multiplex TCP connections over an existing RDP virtual channel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RDPFlux contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/lighttransport/RDPFlux"
Repository = "https://github.com/lighttransport/RDPFlux"
Issues = "https://github.com/lighttransport/RDPFlux/issues"

[project.optional-dependencies]
mstsc = ["win32more>=0.6.9"]
control = ["pillow>=10.0"]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
rdpflux-client = "rdpflux.client:main"
rdpflux-agent = "rdpflux.agent:main"

[tool.setuptools.packages.find]
include = ["rdpflux*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
